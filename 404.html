<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found 🌷</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fdf6ff;
      background-image:
        radial-gradient(ellipse at 15% 10%, #f5e6ff 0%, transparent 50%),
        radial-gradient(ellipse at 85% 90%, #e8f5ff 0%, transparent 50%);
      padding: 40px 24px;
      text-align: center;
      overflow: hidden;
    }

    /* ── Drooping tulip SVG ── */
    .tulip-wrap {
      margin-bottom: 32px;
      animation: sway 4s ease-in-out infinite;
      transform-origin: bottom center;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-4deg); }
      50%       { transform: rotate(4deg); }
    }

    /* ── 404 number ── */
    .error-code {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 700;
      color: #c084e8;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      opacity: 0.18;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -58%);
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      color: #4a1a6b;
      margin-bottom: 14px;
      line-height: 1.2;
    }

    h1 em {
      font-style: italic;
      color: #9b5fcf;
    }

    .subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1.05rem);
      color: #7a5a90;
      font-weight: 600;
      line-height: 1.65;
      max-width: 400px;
      margin-bottom: 36px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #9b5fcf;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 13px 28px;
      border-radius: 99px;
      text-decoration: none;
      box-shadow: 0 6px 24px rgba(155, 95, 207, 0.35);
      transition: transform 0.18s, box-shadow 0.18s;
    }

    .btn-primary:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 32px rgba(155, 95, 207, 0.45);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: #7a5a90;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 13px 28px;
      border-radius: 99px;
      text-decoration: none;
      border: 2px solid #d8b8f0;
      transition: background 0.18s, border-color 0.18s;
    }

    .btn-secondary:hover {
      background: #f5eaff;
      border-color: #b880e0;
    }

    .footer-note {
      margin-top: 52px;
      font-size: 0.78rem;
      color: #b090c8;
      font-weight: 700;
    }

    /* ── Floating petals — subtle ── */
    .petal {
      position: fixed;
      font-size: 1.4rem;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0%   { transform: translateY(105vh) rotate(0deg);   opacity: 0; }
      8%   { opacity: 0.4; }
      92%  { opacity: 0.3; }
      100% { transform: translateY(-8vh) rotate(540deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Faint background 404 -->
  <div class="error-code">404</div>

  <div class="content">

    <!-- Drooping tulip illustration -->
    <div class="tulip-wrap">
      <svg viewBox="0 0 120 200" width="120" height="200" xmlns="http://www.w3.org/2000/svg" overflow="visible">
        <!-- Stem with a gentle droop curve -->
        <path d="M60 190 C60 150 58 120 55 95" stroke="#5a9e60" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- Leaf -->
        <path d="M57 140 Q36 118 44 100" fill="#5a9e60" stroke="none"/>
        <!-- Drooping flower head — tilted to the side -->
        <g transform="translate(55,95) rotate(35)">
          <!-- Petals -->
          <ellipse cx="0"  cy="-18" rx="10" ry="20" fill="#d070c8" opacity="0.85"/>
          <ellipse cx="-13" cy="-10" rx="9"  ry="18" fill="#c060b8" opacity="0.8" transform="rotate(-30 -13 -10)"/>
          <ellipse cx="13"  cy="-10" rx="9"  ry="18" fill="#c060b8" opacity="0.8" transform="rotate(30 13 -10)"/>
          <ellipse cx="-8"  cy="2"   rx="9"  ry="16" fill="#d878d0" opacity="0.75" transform="rotate(-55 -8 2)"/>
          <ellipse cx="8"   cy="2"   rx="9"  ry="16" fill="#d878d0" opacity="0.75" transform="rotate(55 8 2)"/>
          <!-- Inner highlight -->
          <ellipse cx="-3" cy="-14" rx="3" ry="9" fill="white" opacity="0.18"/>
        </g>
        <!-- A few falling petals -->
        <text x="72" y="115" font-size="12" opacity="0.5" transform="rotate(20 72 115)">🌸</text>
        <text x="30" y="130" font-size="10" opacity="0.4" transform="rotate(-15 30 130)">🌸</text>
      </svg>
    </div>

    <h1>Nothing blooming<br><em>over here.</em></h1>
    <p class="subtitle">
      The page you're looking for must have wandered off into the garden.
      Let's get you back somewhere that actually exists.
    </p>

    <div class="btn-group">
      <a href="javascript:history.back()" class="btn-primary">&#8592; Go Back</a>
      <a href="/" class="btn-secondary">🌷 Home</a>
    </div>

    <p class="footer-note">Made with love by Matt &amp; Amanda 🌷</p>
  </div>

  <script>
    // Gentle background petals
    var emojis = ['🌷', '🌸', '✿', '🌺'];
    for (var i = 0; i < 10; i++) {
      var p = document.createElement('span');
      p.className = 'petal';
      p.textContent = emojis[i % emojis.length];
      p.style.left            = (Math.random() * 100) + '%';
      p.style.animationDelay  = (Math.random() * 14) + 's';
      p.style.animationDuration = (14 + Math.random() * 12) + 's';
      p.style.fontSize        = (0.9 + Math.random() * 1.0) + 'rem';
      document.body.appendChild(p);
    }
  </script>
</body>
</html>
